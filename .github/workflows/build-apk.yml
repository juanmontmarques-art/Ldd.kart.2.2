name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  android:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Preparar templates de exportação
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/ 2>/dev/null || true

      - name: Instalar Android SDK 34 (exigido pelo Godot 4.3)
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/lib/android-sdk}}"
          echo "SDK=$SDK"; ls "$SDK" || true
          SDKM="$(find / -name sdkmanager -type f 2>/dev/null | head -1)"
          echo "sdkmanager=$SDKM"
          if [ -z "$SDKM" ]; then
            apt-get update -qq && apt-get install -y -qq unzip wget >/dev/null
            mkdir -p "$SDK/cmdline-tools"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmd.zip
            unzip -q /tmp/cmd.zip -d /tmp/cmd
            mkdir -p "$SDK/cmdline-tools/latest"
            cp -r /tmp/cmd/cmdline-tools/* "$SDK/cmdline-tools/latest/"
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKM" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKM" --sdk_root="$SDK" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest"
          ls "$SDK/build-tools" "$SDK/platforms"

      - name: Criar keystore de debug e configurar o editor
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/lib/android-sdk}}"
          JDK="$(dirname $(dirname $(readlink -f $(which javac))))"
          echo "SDK=$SDK  JDK=$JDK"
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JDK"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOT
          sed -i 's/^          //' ~/.config/godot/editor_settings-4.3.tres

      - name: Importar recursos
        run: godot --headless --verbose --import || true

      - name: Exportar APK
        run: |
          mkdir -p build
          set -o pipefail
          godot --headless --verbose --export-debug "Android" build/KartLivre3D.apk 2>&1 | tee build/export.log
          ls -la build

      - name: Salvar log do build no repositório (diagnóstico)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build
          { echo "== env"; echo "HOME=$HOME"; ls ~/.local/share/godot/export_templates/ 2>&1; cat ~/.config/godot/editor_settings-4.3.tres 2>&1 | grep android; java -version 2>&1; echo "== log"; grep -v -E "EditorTheme|XR:|TextServer" build/export.log 2>&1; } > build/buildlog.txt || true
          MSG=$(grep -v -E "EditorTheme|XR:|TextServer|^$" build/buildlog.txt | tail -n 45 | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::warning title=diag::${MSG}"

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: KartLivre3D-apk
          path: build/KartLivre3D.apk

      - name: Publicar APK em Releases
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK mais recente
          files: build/KartLivre3D.apk
