name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Preparar templates de exportação
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/ 2>/dev/null || true

      - name: Criar keystore de debug e configurar o editor
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/lib/android-sdk}}"
          JDK="$(dirname $(dirname $(readlink -f $(which javac))))"
          echo "SDK=$SDK  JDK=$JDK"
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JDK"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOT
          sed -i 's/^          //' ~/.config/godot/editor_settings-4.3.tres

      - name: Importar recursos
        run: godot --headless --verbose --import || true

      - name: Exportar APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/KartLivre3D.apk
          ls -la build

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: KartLivre3D-apk
          path: build/KartLivre3D.apk

      - name: Publicar APK em Releases
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK mais recente
          files: build/KartLivre3D.apk
